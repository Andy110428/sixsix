<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — TEAM SIXX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --bg:#0a0908; --bg-soft:#141210; --panel:#18140f; --panel-2:#1e1811;
    --line:rgba(255,255,255,0.08); --line-soft:rgba(255,255,255,0.05);
    --text:#f5f0e8; --text-dim:#a89d8f; --text-faint:#6b6156;
    --cyan:#ff7a29; --violet:#c2540f; --amber:#ffb648; --danger:#ff5c7a;
    --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
  h1,h2{ font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background:rgba(255,122,41,0.28); color:#fff; }

  .bg-grid{ position:fixed; inset:0; z-index:-2; background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px); background-size:64px 64px; mask-image:radial-gradient(ellipse 80% 50% at 50% 0%, black 30%, transparent 90%); }
  .bg-glow{ position:fixed; z-index:-1; filter:blur(130px); opacity:0.22; border-radius:50%; pointer-events:none; }
  .glow-1{ width:520px; height:520px; top:-200px; right:-140px; background:var(--cyan); }

  .wrap{ max-width:760px; margin:0 auto; padding:0 24px; }
  header{ position:sticky; top:0; z-index:50; backdrop-filter:blur(14px); background:rgba(10,9,8,0.75); border-bottom:1px solid var(--line); }
  header .wrap{ display:flex; justify-content:space-between; align-items:center; padding:16px 24px; }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.02rem; }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--cyan); box-shadow:0 0 10px var(--cyan),0 0 22px var(--cyan); }
  .brand .tag{ font-family:'IBM Plex Mono',monospace; font-size:0.68rem; color:var(--text-dim); border:1px solid var(--line); padding:3px 9px; border-radius:999px; margin-left:4px; letter-spacing:0.04em; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:var(--radius-sm); font-weight:600; font-size:0.9rem; cursor:pointer; border:1px solid var(--line); transition:transform .15s ease, border-color .15s ease, opacity .15s ease; }
  .btn:hover{ transform:translateY(-1px); }
  .btn-primary{ background:linear-gradient(135deg,var(--cyan),#ffb056); color:#170d03; border:none; box-shadow:0 0 0 1px rgba(255,122,41,0.2), 0 10px 26px -10px rgba(255,122,41,0.6); width:100%; }
  .btn-primary:disabled{ opacity:0.55; cursor:default; transform:none; box-shadow:none; }
  .btn-ghost{ background:rgba(255,255,255,0.03); color:var(--text); }
  .btn-ghost:hover{ border-color:rgba(255,255,255,0.22); }

  .gate-wrap{ min-height:calc(100vh - 65px); display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .gate-card{ width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:34px 30px; position:relative; overflow:hidden; }
  .gate-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--cyan), transparent); }
  .gate-card h1{ font-size:1.2rem; text-align:center; margin-bottom:4px; }
  .gate-card .sub{ text-align:center; color:var(--text-dim); font-size:0.82rem; margin:0 0 22px; }
  .auth-form{ display:flex; flex-direction:column; gap:10px; }
  input, textarea, select{ padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg-soft); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:0.92rem; width:100%; }
  textarea{ font-family:'Inter',sans-serif; min-height:140px; resize:vertical; }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:rgba(255,122,41,0.5); box-shadow:0 0 0 3px rgba(255,122,41,0.12); }
  input::placeholder, textarea::placeholder{ color:var(--text-faint); }

  .result-box{ margin-top:14px; padding:12px 14px; border-radius:var(--radius-sm); font-size:0.85rem; font-family:'IBM Plex Mono',monospace; }
  .result-box.good{ background:rgba(255,122,41,0.1); border:1px solid rgba(255,122,41,0.35); color:var(--cyan); }
  .result-box.warn{ background:rgba(255,92,122,0.1); border:1px solid rgba(255,92,122,0.35); color:var(--danger); }

  main.wrap{ padding:36px 24px 80px; }
  .page-head{ margin-bottom:24px; }
  .page-head .kicker{ font-family:'IBM Plex Mono',monospace; font-size:0.76rem; color:var(--violet); letter-spacing:0.08em; display:block; margin-bottom:6px; }
  .page-head h1{ font-size:1.5rem; }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px; margin-bottom:20px; position:relative; }
  .panel h2{ font-size:1.05rem; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .panel .panel-note{ color:var(--text-dim); font-size:0.83rem; margin:4px 0 16px; }
  .panel-badge{ width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); }

  .stats-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  .stat-box{ background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 14px; text-align:center; transition:border-color .15s ease; }
  .stat-box:hover{ border-color:rgba(255,122,41,0.3); }
  .stat-box .num{ font-family:'Space Grotesk',sans-serif; font-size:1.5rem; font-weight:700; background:linear-gradient(135deg,var(--cyan),var(--amber)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat-box .label{ font-size:0.74rem; color:var(--text-dim); margin-top:4px; }

  .post-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 0; border-top:1px solid var(--line-soft); font-size:0.9rem; }
  .post-row:first-of-type{ border-top:none; }
  .post-row .title-cell{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-actions{ display:flex; align-items:center; flex-shrink:0; }
  .view-btn, .edit-btn, .del-btn{ color:var(--text-dim); font-size:0.78rem; cursor:pointer; border:none; background:none; margin-left:14px; padding:0; transition:color .15s ease; }
  .view-btn:hover, .edit-btn:hover{ color:var(--cyan); }
  .del-btn:hover{ color:var(--danger); }

  .post-detail{ background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; margin-top:2px; margin-bottom:10px; font-size:0.86rem; }
  .post-detail .body{ white-space:pre-wrap; margin-bottom:14px; color:var(--text); }
  .post-detail .comment{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:9px 0; border-top:1px dashed var(--line); }
  .post-detail .comment:first-of-type{ border-top:none; }

  .empty-note{ color:var(--text-faint); font-size:0.85rem; padding:8px 0; }

  footer{ border-top:1px solid var(--line); padding:28px 0; }
  .footer-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .footer-row .disclaimer{ color:var(--text-faint); font-size:0.78rem; }

  @media (max-width:520px){
    .stats-grid{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow glow-1"></div>

<header>
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span>TEAM SIXX <span class="tag">ADMIN</span></a>
    <button type="button" class="btn btn-ghost" id="logout-btn" hidden>로그아웃</button>
  </div>
</header>

<!-- 관리자 로그인 -->
<div class="gate-wrap" id="admin-gate">
  <div class="gate-card">
    <h1>관리자 로그인</h1>
    <p class="sub">허용된 IP에서만 접속할 수 있습니다.</p>
    <form id="login-form" class="auth-form">
      <input type="text" id="admin-username" placeholder="아이디" autocomplete="username">
      <input type="password" id="admin-password" placeholder="비밀번호" autocomplete="current-password">
      <button type="submit" class="btn btn-primary">로그인</button>
    </form>
    <div id="login-result" class="result-box" hidden></div>
  </div>
</div>

<!-- 관리자 대시보드 -->
<main id="dashboard" class="wrap" hidden>
  <div class="page-head">
    <span class="kicker">CONSOLE</span>
    <h1>관리자 대시보드</h1>
  </div>

  <div class="panel">
    <h2><span class="panel-badge"></span>현황</h2>
    <div class="stats-grid" id="stats-grid"></div>
  </div>

  <div class="panel">
    <h2>회원 비밀번호 재설정</h2>
    <p class="panel-note">회원이 비밀번호를 잊고 문의하면, UID 확인 후 여기서 새 비밀번호를 정해서 알려주세요.</p>
    <form id="reset-pw-form" class="auth-form">
      <input type="text" id="reset-uid" placeholder="회원 UID" inputmode="numeric">
      <input type="text" id="reset-new-pw" placeholder="새 비밀번호 (8자 이상)">
      <button type="submit" class="btn btn-primary">재설정하기</button>
    </form>
    <div id="reset-pw-result" class="result-box" hidden></div>
  </div>

  <div class="panel">
    <h2 id="post-form-title">글쓰기</h2>
    <form id="post-form" class="auth-form">
      <input type="hidden" id="post-editing-id" value="">
      <select id="post-category">
        <option value="notice">공지사항</option>
        <option value="lecture">강의</option>
        <option value="profit">수익인증</option>
      </select>
      <input type="text" id="post-title" placeholder="제목">
      <textarea id="post-content" placeholder="내용을 입력하세요"></textarea>
      <input type="file" id="post-image" accept="image/*">
      <div style="display:flex; gap:8px;">
        <button type="submit" class="btn btn-primary">등록하기</button>
        <button type="button" class="btn btn-ghost" id="cancel-edit-btn" hidden>취소</button>
      </div>
    </form>
    <div id="post-result" class="result-box" hidden></div>
  </div>

  <div class="panel">
    <h2>공지사항 목록</h2>
    <div id="notice-list"></div>
  </div>

  <div class="panel">
    <h2>강의 목록</h2>
    <div id="lecture-list"></div>
  </div>

  <div class="panel">
    <h2>질문 목록 (답변·댓글 관리)</h2>
    <div id="question-list"></div>
  </div>

  <div class="panel">
    <h2>수익인증 목록</h2>
    <div id="profit-list"></div>
  </div>
</main>

<footer>
  <div class="wrap footer-row">
    <a href="index.html" style="font-weight:700;">TEAM SIXX</a>
    <div class="disclaimer">관리자 전용 페이지입니다.</div>
  </div>
</footer>

<script>
(function(){
  var gate = document.getElementById('admin-gate');
  var dashboard = document.getElementById('dashboard');
  var logoutBtn = document.getElementById('logout-btn');
  var loginForm = document.getElementById('login-form');
  var loginResult = document.getElementById('login-result');
  var postForm = document.getElementById('post-form');
  var postResult = document.getElementById('post-result');

  function showResult(el, text, kind){ el.hidden = false; el.textContent = text; el.className = 'result-box ' + kind; }

  function unlock(){ gate.hidden = true; dashboard.hidden = false; logoutBtn.hidden = false; loadAllLists(); loadStats(); }
  function lock(){ gate.hidden = false; dashboard.hidden = true; logoutBtn.hidden = true; }

  async function checkSession(){
    try{
      var res = await fetch('/api/admin/me', { credentials:'same-origin' });
      var data = await res.json();
      if(data.ok) unlock(); else lock();
    } catch(e){ lock(); }
  }
  checkSession();

  loginForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var username = document.getElementById('admin-username').value.trim();
    var password = document.getElementById('admin-password').value;
    var btn = loginForm.querySelector('button'); btn.disabled = true;
    try{
      var res = await fetch('/api/admin/login', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: username, password: password }) });
      var data = await res.json();
      if(data.ok) unlock(); else showResult(loginResult, data.error || '로그인에 실패했습니다.', 'warn');
    } catch(e){ showResult(loginResult, '오류가 발생했습니다.', 'warn'); }
    finally{ btn.disabled = false; }
  });

  logoutBtn.addEventListener('click', async function(){
    try{ await fetch('/api/admin/logout', { method:'POST', credentials:'same-origin' }); } catch(e){}
    lock();
  });

  var resetPwForm = document.getElementById('reset-pw-form');
  var resetPwResult = document.getElementById('reset-pw-result');

  resetPwForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var uid = document.getElementById('reset-uid').value.trim();
    var newPw = document.getElementById('reset-new-pw').value;
    if(!uid || newPw.length < 8){ showResult(resetPwResult, 'UID와 8자 이상 비밀번호를 입력해주세요.', 'warn'); return; }
    var btn = resetPwForm.querySelector('button'); btn.disabled = true;
    try{
      var res = await fetch('/api/admin/reset-password', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ uid: uid, newPassword: newPw }) });
      var data = await res.json();
      if(data.ok){ showResult(resetPwResult, '재설정 완료. 회원에게 새 비밀번호를 알려주세요.', 'good'); resetPwForm.reset(); }
      else showResult(resetPwResult, data.error || '재설정에 실패했습니다.', 'warn');
    } catch(e){ showResult(resetPwResult, '오류가 발생했습니다.', 'warn'); }
    finally{ btn.disabled = false; }
  });

  postForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var editingId = document.getElementById('post-editing-id').value;
    var category = document.getElementById('post-category').value;
    var title = document.getElementById('post-title').value.trim();
    var content = document.getElementById('post-content').value.trim();
    var imageFile = document.getElementById('post-image').files[0];
    if(!title || !content) return;
    var btn = postForm.querySelector('button[type=submit]'); btn.disabled = true;
    try{
      var imageData = null;
      if (imageFile && !editingId) {
        imageData = await readFileAsDataUrl(imageFile);
      }
      var url = editingId ? '/api/posts/update' : '/api/posts';
      var payload = editingId
        ? { id: Number(editingId), title: title, content: content }
        : { category: category, title: title, content: content, image_data: imageData };
      var res = await fetch(url, { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      var data = await res.json();
      if(data.ok){
        showResult(postResult, editingId ? '수정되었습니다.' : '등록되었습니다.', 'good');
        resetPostForm();
        loadAllLists();
      } else showResult(postResult, data.error || '처리에 실패했습니다.', 'warn');
    } catch(e){ showResult(postResult, '오류가 발생했습니다.', 'warn'); }
    finally{ btn.disabled = false; }
  });

  function readFileAsDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('cancel-edit-btn').addEventListener('click', resetPostForm);

  function resetPostForm(){
    document.getElementById('post-editing-id').value = '';
    document.getElementById('post-title').value = '';
    document.getElementById('post-content').value = '';
    document.getElementById('post-image').value = '';
    document.getElementById('post-category').disabled = false;
    document.getElementById('post-form-title').textContent = '글쓰기';
    document.getElementById('cancel-edit-btn').hidden = true;
    postForm.querySelector('button[type=submit]').textContent = '등록하기';
  }

  function startEdit(post){
    document.getElementById('post-editing-id').value = post.id;
    document.getElementById('post-title').value = post.title;
    document.getElementById('post-content').value = post.content;
    document.getElementById('post-category').disabled = true;
    document.getElementById('post-form-title').textContent = '글 수정';
    document.getElementById('cancel-edit-btn').hidden = false;
    postForm.querySelector('button[type=submit]').textContent = '수정 완료';
    window.scrollTo({ top: postForm.offsetTop - 20, behavior: 'smooth' });
  }

  async function loadStats(){
    var el = document.getElementById('stats-grid');
    try{
      var res = await fetch('/api/admin/stats', { credentials:'same-origin' });
      var data = await res.json();
      if(!data.ok) return;
      el.innerHTML =
        statBox(data.members, '회원 수') +
        statBox(data.notices, '공지') +
        statBox(data.lectures, '강의') +
        statBox(data.questions, '질문') +
        statBox(data.profit, '수익인증') +
        statBox(data.comments, '댓글');
    } catch(e){}
  }
  function statBox(num, label){
    return '<div class="stat-box"><div class="num">' + num + '</div><div class="label">' + label + '</div></div>';
  }

  async function loadList(category, elId){
    var el = document.getElementById(elId);
    el.innerHTML = '';
    try{
      var res = await fetch('/api/posts?category=' + category, { credentials:'same-origin' });
      var data = await res.json();
      var posts = (data.ok && data.posts) ? data.posts : [];
      if(posts.length === 0){ el.innerHTML = '<div class="empty-note">등록된 글이 없습니다.</div>'; return; }
      posts.forEach(function(p){
        var row = document.createElement('div');
        row.className = 'post-row';
        var detailBox = document.createElement('div');
        detailBox.className = 'post-detail';
        detailBox.hidden = true;

        var left = document.createElement('span');
        left.className = 'title-cell';
        left.textContent = p.title;

        var actions = document.createElement('div');
        actions.className = 'row-actions';

        var viewBtn = document.createElement('button');
        viewBtn.className = 'view-btn';
        viewBtn.textContent = '보기';
        viewBtn.addEventListener('click', async function(){
          if(!detailBox.hidden){ detailBox.hidden = true; return; }
          await renderDetail(p.id, detailBox);
          detailBox.hidden = false;
        });

        var editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.textContent = '수정';
        editBtn.hidden = category === 'question'; // 질문은 작성자 본인만 수정 가능 (관리자는 삭제/답변만)
        editBtn.addEventListener('click', async function(){
          var res = await fetch('/api/posts/detail?id=' + p.id, { credentials:'same-origin' });
          var data = await res.json();
          if(data.ok) startEdit(data.post);
        });

        var del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '삭제';
        del.addEventListener('click', async function(){
          if(!confirm('삭제하시겠습니까?')) return;
          await fetch('/api/posts/delete', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: p.id }) });
          loadAllLists();
        });

        actions.appendChild(viewBtn);
        actions.appendChild(editBtn);
        actions.appendChild(del);
        row.appendChild(left);
        row.appendChild(actions);
        el.appendChild(row);
        el.appendChild(detailBox);
      });
    } catch(e){ el.innerHTML = '<div class="empty-note">불러오기에 실패했습니다.</div>'; }
  }

  async function renderDetail(postId, box){
    box.innerHTML = '불러오는 중...';
    try{
      var res = await fetch('/api/posts/detail?id=' + postId, { credentials:'same-origin' });
      var data = await res.json();
      if(!data.ok){ box.textContent = '불러오기에 실패했습니다.'; return; }
      var html = '<div class="body">' + escapeHtml(data.post.content) + '</div>';
      data.comments.forEach(function(c){
        html += '<div class="comment"><div><b>' + (c.author_type === 'admin' ? '관리자' : 'UID ' + c.author_id) + '</b>: ' + escapeHtml(c.content) + '</div>' +
          '<button class="del-btn" data-cid="' + c.id + '">삭제</button></div>';
      });
      html += '<form class="comment-reply-form" style="display:flex; gap:8px; margin-top:10px;">' +
        '<input type="text" placeholder="답변/댓글 입력" style="flex:1;">' +
        '<button type="submit" class="btn btn-primary" style="width:auto;">등록</button></form>';
      box.innerHTML = html;

      box.querySelectorAll('.del-btn[data-cid]').forEach(function(btn){
        btn.addEventListener('click', async function(){
          await fetch('/api/comments/delete', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: Number(btn.dataset.cid) }) });
          renderDetail(postId, box);
        });
      });
      box.querySelector('.comment-reply-form').addEventListener('submit', async function(e){
        e.preventDefault();
        var input = e.target.querySelector('input');
        var text = input.value.trim();
        if(!text) return;
        await fetch('/api/comments', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ post_id: postId, content: text }) });
        renderDetail(postId, box);
      });
    } catch(e){ box.textContent = '불러오기에 실패했습니다.'; }
  }

  function loadAllLists(){
    loadList('notice', 'notice-list');
