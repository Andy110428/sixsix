<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="1;url=portal.html">
<title>TEAM SIXX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --bg:#0a0908; --panel:#18140f; --line:rgba(255,255,255,0.08);
    --text:#f5f0e8; --text-dim:#a89d8f; --cyan:#ff7a29;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family:'Space Grotesk',sans-serif; }
  .bg-glow{ position:fixed; z-index:-1; width:520px; height:520px; top:-180px; left:50%; transform:translateX(-50%); filter:blur(130px); opacity:0.25; border-radius:50%; background:var(--cyan); pointer-events:none; }
  .card{ text-align:center; padding:20px; }
  .brand{ display:flex; align-items:center; justify-content:center; gap:10px; font-weight:700; font-size:1.4rem; margin-bottom:14px; }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--cyan); box-shadow:0 0 10px var(--cyan),0 0 24px var(--cyan); }
  p{ font-family:'IBM Plex Mono',monospace; font-size:0.85rem; color:var(--text-dim); margin:0 0 20px; }
  a.btn{ display:inline-block; padding:12px 24px; border-radius:8px; font-weight:600; font-size:0.9rem; text-decoration:none; color:#170d03; background:linear-gradient(135deg,var(--cyan),#ffb056); box-shadow:0 8px 24px -8px rgba(255,122,41,0.55); }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card">
  <div class="brand"><span class="dot"></span>TEAM SIXX</div>
  <p>스터디룸으로 이동 중입니다...</p>
  <a class="btn" href="portal.html">지금 이동하기</a>
</div>
</body>
</html>
